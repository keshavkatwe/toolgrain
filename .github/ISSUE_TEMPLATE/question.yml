name: Usage question
description: Ask about using Toolgrain in your application.
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Start with the [documentation](https://toolgrain.mintlify.site/)
        and [examples](https://toolgrain.mintlify.site/examples).
        Remove credentials and private data from any code you share.
  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
      description: Explain the goal, what you tried, and where you are stuck. Link any relevant documentation.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Code and environment
      description: Include a small example, Toolgrain/runtime versions, and client/transport if relevant.
