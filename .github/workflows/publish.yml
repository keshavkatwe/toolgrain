name: npm publication

on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed version, for example 0.1.0-rc.0 or 0.1.0 (without v)
        required: true
        type: string
      dist_tag:
        description: npm channel (next for RC versions, latest for stable)
        required: true
        type: choice
        options: [next, latest]
        default: next
      dry_run:
        description: Check packages without publishing (leave enabled during preparation)
        required: true
        type: boolean
        default: true
      confirmation:
        description: For a real publish, type publish followed by the exact version (for example, publish 0.1.0-rc.0)
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  guard:
    name: Validate publication request
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate the version and npm tag; require main for a real publish
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_DIST_TAG: ${{ inputs.dist_tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$GITHUB_REPOSITORY" = keshavkatwe/toolgrain
          version_core='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          if [[ "$RELEASE_VERSION" =~ ^${version_core}-rc\.(0|[1-9][0-9]*)$ ]]; then
            test "$RELEASE_DIST_TAG" = next
          elif [[ "$RELEASE_VERSION" =~ ^${version_core}$ ]]; then
            test "$RELEASE_DIST_TAG" = latest
          else
            echo "Expected a stable version or an rc.N candidate" >&2
            exit 1
          fi
          if [ "$DRY_RUN" != true ]; then
            test "$GITHUB_REF" = refs/heads/main
            test "$CONFIRMATION" = "publish $RELEASE_VERSION"
          fi

  verify:
    name: Verify the requested release
    needs: guard
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ inputs.version }}

  publish:
    name: Pack and publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Restrict this environment to main; add required reviewers where the GitHub
    # plan supports them. Each npm trusted publisher must name it exactly.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24.20.0"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install the pinned OIDC-capable npm CLI
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@11.21.1 --ignore-scripts

      - name: Install and build the libraries
        run: |
          bun install --frozen-lockfile
          bun run build --filter='./packages/*'

      - name: Check aligned versions and packed contents
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          bun run release:check --version "$RELEASE_VERSION"
          for package in protocol mcp http node jwt clerk; do
            test "$(jq -r .publishConfig.tag "packages/$package/package.json")" = "$RELEASE_DIST_TAG"
          done
          bun run test:size

      - name: Pack the six libraries in dependency order
        run: |
          mkdir -p "$RUNNER_TEMP/toolgrain-npm"
          for package in protocol mcp http node jwt clerk; do
            (
              cd "packages/$package"
              bun pm pack --ignore-scripts --filename "$RUNNER_TEMP/toolgrain-npm/$package.tgz"
            )
          done

      - name: Dry run or publish the checked archives
        working-directory: ${{ runner.temp }}/toolgrain-npm
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_DIST_TAG: ${{ inputs.dist_tag }}
          # npm cannot generate provenance from a private repository. Enable it
          # automatically if the source repository becomes public in the future.
          NPM_CONFIG_PROVENANCE: ${{ !inputs.dry_run && !github.event.repository.private }}
        run: |
          publish_options=()
          if [ "$DRY_RUN" = true ]; then
            publish_options+=(--dry-run)
          fi
          for package in protocol mcp http node jwt clerk; do
            npm publish "./$package.tgz" --ignore-scripts --access public \
              --registry=https://registry.npmjs.org/ --tag "$RELEASE_DIST_TAG" \
              "${publish_options[@]}"
          done
