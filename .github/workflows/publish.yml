name: npm publication

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  select-mode:
    if: github.repository == 'keshavkatwe/toolgrain' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/prerelease/')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.mode.outputs.publish-plan-artifact-id }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      stable-version: ${{ steps.release.outputs.stable-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-setup
      - name: Check the publication branch, version, and channel
        id: release
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, existsSync, readFileSync, readdirSync } from 'node:fs';
          import assert from 'node:assert/strict';
          import { checkRelease } from './packages/repo-tools/src/release.mjs';
          import { publicationPolicy, stablePublicationBaseline } from './packages/repo-tools/src/publication-policy.mjs';
          const preState = existsSync('.changeset/pre.json') ? JSON.parse(readFileSync('.changeset/pre.json', 'utf8')) : undefined;
          const source = checkRelease(process.cwd());
          const stableVersion = process.env.GITHUB_REF === 'refs/heads/main' ? undefined : await stablePublicationBaseline(source.packages);
          const policy = publicationPolicy(source, {
            ref: process.env.GITHUB_REF, eventName: process.env.GITHUB_EVENT_NAME, preState,
            stableVersion,
          });
          if (policy.tag === 'rc') {
            assert(readdirSync('.changeset').every(name => name === 'README.md' || !name.endsWith('.md')), 'Version all pending changesets before dispatching an RC');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${policy.version}\ntag=${policy.tag}\nstable-version=${policy.stableVersion}\n`);
          JS
      # Changesets Action v2.1.2; CLI 3 uses the v2 subactions.
      - id: mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51

  version:
    if: needs.select-mode.outputs.mode == 'version' && github.ref == 'refs/heads/main'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-setup
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51
        with:
          script: bun run release:version
          commit-message: 'chore: version packages'
          pr-title: 'Release Toolgrain packages'

  verify:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.select-mode.outputs.version }}

  main-checks:
    name: Main baseline
    if: needs.select-mode.outputs.mode != 'publish' && github.ref == 'refs/heads/main'
    needs: select-mode
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: ./.github/workflows/ci.yml

  main-support:
    name: Main support
    if: needs.select-mode.outputs.mode != 'publish' && github.ref == 'refs/heads/main'
    needs: select-mode
    permissions:
      contents: read
    uses: ./.github/workflows/support.yml

  pack:
    needs: [select-mode, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-setup
      - run: bun run build --filter='./packages/*'
      - run: bun run release:check
      - run: bun run test:size
      - id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: [select-mode, pack]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Keep this filename and environment: all six npm OIDC bindings name them.
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          path: ${{ runner.temp }}/toolgrain-publish-guard
          merge-multiple: true
      - name: Require the verified version and intended npm tag in the packed plan
        env:
          RELEASE_VERSION: ${{ needs.select-mode.outputs.version }}
          RELEASE_TAG: ${{ needs.select-mode.outputs.tag }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { checkRelease } from './packages/repo-tools/src/release.mjs';
          import { validatePublishPlan } from './packages/repo-tools/src/publication-policy.mjs';
          const plan = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/toolgrain-publish-guard/publish-plan.json`, 'utf8'));
          validatePublishPlan(plan, checkRelease(process.cwd()).packages, { version: process.env.RELEASE_VERSION, tag: process.env.RELEASE_TAG });
          JS
      - name: Publish the packed artifacts, tags, and package releases
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51
        env:
          # npm provenance requires a public source repository.
          NPM_CONFIG_PROVENANCE: ${{ !github.event.repository.private }}
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: true
          push-git-tags: true

  registry:
    name: Verify all six published packages
    needs: [select-mode, pack, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          path: ${{ runner.temp }}/toolgrain-published
          merge-multiple: true
      - name: Verify the selected npm tag, archive integrity, and stable RC baseline
        env:
          RELEASE_TAG: ${{ needs.select-mode.outputs.tag }}
          STABLE_VERSION: ${{ needs.select-mode.outputs.stable-version }}
        run: node packages/repo-tools/src/cli.mjs verify-publication --pack-dir "$RUNNER_TEMP/toolgrain-published" --tag "$RELEASE_TAG" --preserve-latest "$STABLE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: published-registry
          path: reports/publication.json
          if-no-files-found: error

  consumers:
    name: Published ${{ matrix.runtime }} consumers
    needs: registry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runtime: node, manager: npm, bun: '1.3.14' }
          - { runtime: bun, manager: bun, bun: '1.4.4' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Install public npm packages and check declarations and runtime flows
        run: node packages/repo-tools/src/cli.mjs clean-install --published --runtime=${{ matrix.runtime }} --package-manager=${{ matrix.manager }} --zod=4.6.6
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: published-${{ matrix.runtime }}-consumer
          path: reports/clean-install.json
          if-no-files-found: error
