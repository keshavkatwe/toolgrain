name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Core package checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.20.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting, lint, and imports
        run: bun run check

      - name: Check types
        run: bun run check-types

      - name: Run tests
        run: bun run test

      - name: Build packages
        run: bun run build

      - name: Verify compiled package and declarations
        run: bun run --cwd packages/core test:package
