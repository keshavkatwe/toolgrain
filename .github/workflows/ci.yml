name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Package checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.20.0"

      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile

      - name: Check formatting, lint, and imports
        id: style
        run: bun run check

      - name: Audit locked dependencies for every workspace
        id: audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run test:audit

      - name: Check types
        id: types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run check-types

      - name: Test libraries with coverage and run example smoke tests
        id: tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run test:coverage test:examples --continue=dependencies-successful

      - name: Build packages
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run build

      - name: Verify compiled packages and declarations
        id: packages
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bun run test:package

      - name: Check library package sizes and contents
        id: size
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run test:size

      - name: Test CI checks and report generation
        id: reporting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run test:ci

      - name: Write package check summary
        if: ${{ !cancelled() }}
        env:
          CI_STEPS: ${{ toJSON(steps) }}
        run: node packages/repo-tools/src/cli.mjs ci-report

      - name: Upload package check reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            reports/
            packages/*/reports/
            packages/*/coverage/
          retention-days: 14
          if-no-files-found: error

  publish-report:
    name: Publish PR report
    needs: check
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Download report
        uses: actions/download-artifact@v4
        with:
          name: test-and-coverage-reports
          path: ci-reports

      - name: Comment on pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Update the workflow's previous report rather than adding a comment per push.
        run: gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body-file ci-reports/reports/pr-report.md
