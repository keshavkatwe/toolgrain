name: Release verification

on:
  workflow_dispatch:
    inputs:
      version:
        description: Prepared version to verify, for example 0.1.0-rc.0 (without v)
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: Prepared version to verify, for example 0.1.0-rc.0 (without v)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate prepared release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.20.0"
      - name: Require the requested version across all libraries
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node packages/repo-tools/src/cli.mjs release check --version "$RELEASE_VERSION"

  baseline:
    name: Baseline
    needs: validate
    # CI also defines a PR-report job. It is skipped for workflow_dispatch;
    # reusable workflows cannot request permissions beyond the caller's grants.
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  support:
    name: Supported runtimes and dependencies
    needs: validate
    uses: ./.github/workflows/support.yml
    with:
      full: true

  initial-archives:
    name: Verified first-publication archives
    needs: [validate, baseline, support]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/release-setup
      - run: bun run build --filter='./packages/*'
      - run: bun run release:check
      - run: bun run release:pack-initial --directory "$RUNNER_TEMP/toolgrain-initial" --source-sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-initial-publications
          path: ${{ runner.temp }}/toolgrain-initial/
          if-no-files-found: error

