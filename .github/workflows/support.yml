name: Support matrix

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: support-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.preview }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Node 24 latest / Linux, os: ubuntu-latest, node: "24", bun: "1.3.14", runtime: node, manager: npm, preview: false }
          - { name: Bun minimum / Linux, os: ubuntu-latest, node: "24.20.0", bun: "1.4.4", runtime: bun, manager: bun, zod: "4.0.0", preview: false }
          - { name: Bun 1 latest / Linux, os: ubuntu-latest, node: "24.20.0", bun: "1.x", runtime: bun, manager: bun, preview: false }
          - { name: Node 24 / macOS, os: macos-latest, node: "24", bun: "1.3.14", runtime: node, manager: npm, preview: false }
          - { name: Node 24 / Windows, os: windows-latest, node: "24", bun: "1.3.14", runtime: node, manager: npm, preview: false }
          - { name: Bun 1 / macOS, os: macos-latest, node: "24.20.0", bun: "1.x", runtime: bun, manager: bun, preview: false }
          - { name: Bun 1 / Windows, os: windows-latest, node: "24.20.0", bun: "1.x", runtime: bun, manager: bun, preview: false }
          - { name: Node 26 preview / Linux, os: ubuntu-latest, node: "26", bun: "1.3.14", runtime: node, manager: npm, preview: true }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Record actual runtime and platform versions
        run: node -e "console.log(process.version, process.platform, process.arch)"
      - run: bun --version
      - run: bun install --frozen-lockfile
      - name: Build libraries
        run: bun run build --filter="./packages/*"
      # Run directly: compatibility results must never come from Turbo's cache.
      - name: Verify packed consumers and minimum/current declarations
        run: node packages/repo-tools/src/cli.mjs clean-install --runtime=${{ matrix.runtime }} --package-manager=${{ matrix.manager }} ${{ matrix.zod && format('--zod={0}', matrix.zod) || '' }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: support-${{ strategy.job-index }}
          path: reports/clean-install.json
          retention-days: 14
          if-no-files-found: error

  typescript-versions:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24.20.0"
      - id: matrix
        name: Latest patch of every supported TypeScript minor
        run: node packages/repo-tools/src/cli.mjs support-matrix

  intermediate-types:
    needs: typescript-versions
    name: TypeScript ${{ matrix.version }} / latest Zod 4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.typescript-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24.20.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build --filter="./packages/*"
      - name: Check installed declarations with the selected compiler and Zod 4
        run: node packages/repo-tools/src/cli.mjs clean-install --typescript=${{ matrix.version }} --zod=^4.0.0
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: typescript-${{ matrix.version }}
          path: reports/clean-install.json
          retention-days: 14

  upstream:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.preview }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Stable dependency drift, bun: "1.x", typescript: latest, preview: false }
          - { name: Prerelease canary, bun: canary, typescript: next, preview: true }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24.20.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Probe upstream dependencies in this disposable checkout
        env:
          TOOLGRAIN_COMPILER: ${{ matrix.typescript }}
        run: node packages/repo-tools/src/cli.mjs support-matrix --prepare-drift
      - run: bun install
      - run: bun run build --filter="./packages/*"
      - run: bun run test:coverage --filter="./packages/*"
      - run: bun run test:package
      - name: Exercise the selected Bun runtime
        run: node packages/repo-tools/src/cli.mjs clean-install --runtime=bun --package-manager=bun
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: upstream-${{ strategy.job-index }}
          path: reports/clean-install.json
          retention-days: 14
